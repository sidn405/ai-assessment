<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept Admin Invite - Achieve 365</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <meta name="description" content="Achieve 365 - Admin invite acceptance">
  <meta name="theme-color" content="#1e3a5f">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/static/graphics/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/graphics/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/graphics/logo.png">
  <link rel="shortcut icon" href="/static/graphics/favicon.png">

  <style>
    body {
      background: linear-gradient(135deg, #2A398A 0%, #4a56af 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Open Sans', sans-serif;
    }

    .reset-container {
      background: white;
      border-radius: 20px;
      padding: 3rem;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    h1 {
      color: #2A398A;
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #333;
    }

    input {
      width: 100%;
      padding: 0.875rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }

    input:focus {
      outline: none;
      border-color: #2A398A;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: #2A398A;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover {
      background: #191f4e;
      transform: translateY(-2px);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }

    .success {
      background: #d4edda;
      color: #155724;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 38px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: #666;
      font-size: 18px;
      transition: color 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle-btn:hover {
      color: #2A398A;
    }

    .password-toggle-btn:focus {
      outline: none;
      color: #2A398A;
    }
  </style>
</head>

<body>
  <div class="reset-container">
    <h1>Accept Admin Invite</h1>
    <p style="color: #666; margin-bottom: 2rem;">
      Set your password to activate your administrator account.
    </p>

    <div id="error" class="error"></div>
    <div id="success" class="success"></div>

    <form id="acceptInviteForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
        <button
          type="button"
          class="password-toggle-btn"
          onclick="togglePassword('newPassword')"
          aria-label="Toggle password visibility"
          title="Show/Hide password"
        >
          <i class="fas fa-eye" id="newPassword-icon"></i>
        </button>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter password">
        <button
          type="button"
          class="password-toggle-btn"
          onclick="togglePassword('confirmPassword')"
          aria-label="Toggle password visibility"
          title="Show/Hide password"
        >
          <i class="fas fa-eye" id="confirmPassword-icon"></i>
        </button>
      </div>

      <button type="submit" class="btn">Activate Admin Account</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem;">
      <a href="/" style="color: #2A398A; font-weight: 600; text-decoration: none;">Back to Login</a>
    </p>
  </div>

  <script>
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(inputId + '-icon');

      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.getElementById('error').textContent = 'Invalid invite link';
      document.getElementById('error').style.display = 'block';
      document.getElementById('acceptInviteForm').style.display = 'none';
    }

    document.getElementById('acceptInviteForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('error');
      const successDiv = document.getElementById('success');
      const submitBtn = e.target.querySelector('button.btn');

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      if (newPassword !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Activating...';

      try {
        const response = await fetch('/api/admin/invites/accept', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: token,
            password: newPassword
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          successDiv.textContent = '✅ Admin account activated! Redirecting to login...';
          successDiv.style.display = 'block';

          setTimeout(() => {
            window.location.href = '/';
          }, 2000);
        } else {
          errorDiv.textContent = data.detail || 'Failed to accept invite';
          errorDiv.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Activate Admin Account';
        }
      } catch (error) {
        console.error('Invite accept error:', error);
        errorDiv.textContent = 'Failed to accept invite. Please try again.';
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Activate Admin Account';
      }
    });
  </script>
</body>
</html>

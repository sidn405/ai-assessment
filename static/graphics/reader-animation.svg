<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;" role="img">
<title>Reader in armchair loading animation</title>
<style>
@keyframes idle-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%,97%{transform:scaleY(0.05)}}
@keyframes look-up{0%,55%,100%{transform:rotate(0deg)}60%,80%{transform:rotate(-8deg)}85%{transform:rotate(-4deg)}}
@keyframes page-flip{0%,75%,100%{opacity:1}80%{opacity:0.3}85%{opacity:1}}
@keyframes lamp-glow{0%,100%{opacity:0.5}50%{opacity:0.8}}
.bob{animation:idle-bob 3s ease-in-out infinite}
.blink{animation:blink 5s ease-in-out infinite;transform-origin:center}
.look{animation:look-up 7s ease-in-out infinite;transform-origin:200px 145px}
.page{animation:page-flip 10s ease-in-out infinite}
.glow{animation:lamp-glow 2s ease-in-out infinite}
</style>

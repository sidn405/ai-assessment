<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">
  <defs>
    <!-- Chair gradient -->
    <linearGradient id="chairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5E3C"/>
      <stop offset="100%" stop-color="#5C3D1E"/>
    </linearGradient>
    <!-- Skin tone -->
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8D5524"/>
      <stop offset="100%" stop-color="#7B4A1E"/>
    </linearGradient>
    <!-- Book gradient -->
    <linearGradient id="bookGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <!-- Lamp glow -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF9C4" stop-opacity="0"/>
    </radialGradient>

    <!-- Page turn animation -->
    <style>
      /* Bobbing idle animation */
      @keyframes idle-bob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      /* Blink eyes */
      @keyframes blink {
        0%, 94%, 100% { transform: scaleY(1); }
        96%, 98% { transform: scaleY(0.05); }
      }
      /* Look up occasionally */
      @keyframes look-up {
        0%, 60%, 100% { transform: translateY(0); }
        65%, 75% { transform: translateY(-6px); }
        80% { transform: translateY(-4px); }
        85% { transform: translateY(-6px); }
        90% { transform: translateY(0); }
      }
      /* Page flip */
      @keyframes page-flip {
        0%, 80%, 100% { transform: rotateY(0deg); opacity: 1; }
        85% { transform: rotateY(-90deg); opacity: 0; }
        90% { transform: rotateY(90deg); opacity: 0; }
        95% { transform: rotateY(0deg); opacity: 1; }
      }
      /* Lamp flicker */
      @keyframes lamp-flicker {
        0%, 95%, 100% { opacity: 1; }
        96% { opacity: 0.7; }
        97% { opacity: 1; }
        98% { opacity: 0.8; }
        99% { opacity: 1; }
      }
      /* Book text lines scroll slightly */
      @keyframes text-scroll {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      /* Hair sway */
      @keyframes hair-sway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(1deg); }
      }
      /* Breathing */
      @keyframes breathe {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.03); }
      }

      .body-group { animation: idle-bob 3s ease-in-out infinite; }
      .head-group { animation: look-up 8s ease-in-out infinite; }
      .eyes { animation: blink 5s ease-in-out infinite; }
      .book-page { animation: page-flip 12s ease-in-out infinite; }
      .lamp-light { animation: lamp-flicker 10s ease-in-out infinite; }
      .text-lines { animation: text-scroll 3s ease-in-out infinite; }
      .torso { animation: breathe 3s ease-in-out infinite; transform-origin: center bottom; }
    </style>
  </defs>

  <!-- Background warm reading nook -->
  <rect width="400" height="320" fill="#1a1a2e" rx="16"/>
  <!-- Wall -->
  <rect x="0" y="0" width="400" height="220" fill="#2d2d44" rx="16"/>
  <!-- Floor -->
  <rect x="0" y="220" width="400" height="100" fill="#1e1a16"/>
  <!-- Rug -->
  <ellipse cx="200" cy="270" rx="150" ry="30" fill="#8B3A3A" opacity="0.6"/>
  <!-- Bookshelf on wall -->
  <rect x="20" y="40" width="80" height="120" fill="#4a3728" rx="4"/>
  <rect x="20" y="40" width="80" height="8" fill="#5c4535" rx="2"/>
  <rect x="20" y="80" width="80" height="6" fill="#5c4535" rx="2"/>
  <rect x="20" y="120" width="80" height="6" fill="#5c4535" rx="2"/>
  <!-- Books on shelf -->
  <rect x="24" y="48" width="10" height="28" fill="#c0392b" rx="1"/>
  <rect x="35" y="52" width="8" height="24" fill="#2980b9" rx="1"/>
  <rect x="44" y="49" width="11" height="27" fill="#27ae60" rx="1"/>
  <rect x="56" y="53" width="9" height="23" fill="#f39c12" rx="1"/>
  <rect x="66" y="50" width="10" height="26" fill="#8e44ad" rx="1"/>
  <rect x="77" y="54" width="8" height="22" fill="#e74c3c" rx="1"/>
  <rect x="24" y="88" width="9" height="28" fill="#1abc9c" rx="1"/>
  <rect x="34" y="90" width="11" height="26" fill="#e67e22" rx="1"/>
  <rect x="46" y="89" width="8" height="27" fill="#9b59b6" rx="1"/>
  <rect x="55" y="91" width="10" height="25" fill="#3498db" rx="1"/>
  <rect x="66" y="88" width="9" height="28" fill="#e74c3c" rx="1"/>
  <rect x="76" y="92" width="9" height="24" fill="#2ecc71" rx="1"/>

  <!-- Floor lamp -->
  <rect x="320" y="80" width="6" height="160" fill="#bdc3c7" rx="3"/>
  <polygon points="295,80 345,80 340,100 300,100" fill="#95a5a6"/>
  <ellipse cx="323" cy="80" rx="28" ry="8" fill="#ecf0f1"/>
  <!-- Lamp glow -->
  <ellipse cx="320" cy="150" rx="80" ry="100" fill="url(#lampGlow)" class="lamp-light"/>

  <!-- ARMCHAIR -->
  <g transform="translate(110, 140)">
    <!-- Chair back -->
    <rect x="0" y="0" width="160" height="110" rx="20" fill="url(#chairGrad)" opacity="0.95"/>
    <!-- Chair back cushion -->
    <rect x="10" y="10" width="140" height="90" rx="14" fill="#A0714F" opacity="0.7"/>
    <!-- Chair seat -->
    <rect x="-15" y="90" width="190" height="50" rx="15" fill="url(#chairGrad)"/>
    <!-- Seat cushion -->
    <rect x="-5" y="95" width="170" height="40" rx="12" fill="#A0714F" opacity="0.7"/>
    <!-- Left armrest -->
    <rect x="-20" y="50" width="30" height="80" rx="12" fill="url(#chairGrad)"/>
    <!-- Right armrest -->
    <rect x="150" y="50" width="30" height="80" rx="12" fill="url(#chairGrad)"/>
    <!-- Legs -->
    <rect x="10" y="135" width="20" height="25" rx="5" fill="#4a2f1a"/>
    <rect x="130" y="135" width="20" height="25" rx="5" fill="#4a2f1a"/>
  </g>

  <!-- CHARACTER sitting in chair -->
  <g class="body-group" transform="translate(180, 115)">

    <!-- Legs/Feet -->
    <g transform="translate(-30, 155)">
      <!-- Left leg -->
      <rect x="0" y="0" width="28" height="45" rx="10" fill="#2c3e50"/>
      <ellipse cx="14" cy="45" rx="16" ry="8" fill="#1a252f"/>
      <!-- Right leg -->
      <rect x="32" y="0" width="28" height="45" rx="10" fill="#2c3e50"/>
      <ellipse cx="46" cy="45" rx="16" ry="8" fill="#1a252f"/>
    </g>

    <!-- Torso / Body -->
    <g class="torso">
      <rect x="-35" y="60" width="70" height="90" rx="20" fill="#2471A3"/>
      <!-- Shirt collar -->
      <polygon points="-10,60 10,60 0,80" fill="#f5f5f5" opacity="0.9"/>
      <!-- Shirt pocket -->
      <rect x="10" y="90" width="18" height="15" rx="3" fill="#1a5276" opacity="0.8"/>
    </g>

    <!-- Left arm holding book -->
    <rect x="-70" y="100" width="40" height="22" rx="10" fill="#2471A3" transform="rotate(-10, -50, 111)"/>
    <!-- Right arm -->
    <rect x="32" y="100" width="40" height="22" rx="10" fill="#2471A3" transform="rotate(10, 52, 111)"/>

    <!-- Hands -->
    <ellipse cx="-60" cy="128" rx="14" ry="10" fill="url(#skinGrad)"/>
    <ellipse cx="60" cy="128" rx="14" ry="10" fill="url(#skinGrad)"/>

    <!-- BOOK -->
    <g transform="translate(-45, 118)" class="book-page">
      <!-- Book spine -->
      <rect x="38" y="-5" width="8" height="28" fill="#1e3a5f"/>
      <!-- Left page -->
      <rect x="0" y="-2" width="40" height="26" rx="2" fill="#fdf6e3"/>
      <!-- Right page -->
      <rect x="46" y="-2" width="40" height="26" rx="2" fill="#fdf6e3"/>
      <!-- Text lines left page -->
      <g class="text-lines">
        <rect x="4" y="3" width="32" height="2" rx="1" fill="#aaa"/>
        <rect x="4" y="8" width="28" height="2" rx="1" fill="#bbb"/>
        <rect x="4" y="13" width="32" height="2" rx="1" fill="#aaa"/>
        <rect x="4" y="18" width="20" height="2" rx="1" fill="#bbb"/>
      </g>
      <!-- Text lines right page -->
      <g class="text-lines">
        <rect x="50" y="3" width="32" height="2" rx="1" fill="#aaa"/>
        <rect x="50" y="8" width="26" height="2" rx="1" fill="#bbb"/>
        <rect x="50" y="13" width="32" height="2" rx="1" fill="#aaa"/>
        <rect x="50" y="18" width="22" height="2" rx="1" fill="#bbb"/>
      </g>
    </g>

    <!-- NECK -->
    <rect x="-12" y="35" width="24" height="30" rx="10" fill="url(#skinGrad)"/>

    <!-- HEAD group (moves for look-up) -->
    <g class="head-group">
      <!-- Head -->
      <ellipse cx="0" cy="18" rx="38" ry="40" fill="url(#skinGrad)"/>
      <!-- Hair -->
      <ellipse cx="0" cy="-16" rx="38" ry="20" fill="#1a1a1a"/>
      <rect x="-38" y="-16" width="76" height="16" fill="#1a1a1a" rx="4"/>
      <!-- Ears -->
      <ellipse cx="-37" cy="22" rx="7" ry="10" fill="url(#skinGrad)"/>
      <ellipse cx="37" cy="22" rx="7" ry="10" fill="url(#skinGrad)"/>
      <!-- Eyes (look down at book normally, occasionally look up) -->
      <g class="eyes">
        <!-- Eye whites -->
        <ellipse cx="-14" cy="20" rx="10" ry="8" fill="white"/>
        <ellipse cx="14" cy="20" rx="10" ry="8" fill="white"/>
        <!-- Pupils (looking down toward book) -->
        <ellipse cx="-13" cy="23" rx="5" ry="5" fill="#1a1a1a"/>
        <ellipse cx="13" cy="23" rx="5" ry="5" fill="#1a1a1a"/>
        <!-- Eye shine -->
        <ellipse cx="-11" cy="21" rx="1.5" ry="1.5" fill="white"/>
        <ellipse cx="15" cy="21" rx="1.5" ry="1.5" fill="white"/>
        <!-- Eyelids for blink -->
        <rect x="-24" y="14" width="20" height="15" rx="7" fill="url(#skinGrad)" opacity="0" class="eyelid"/>
        <rect x="4" y="14" width="20" height="15" rx="7" fill="url(#skinGrad)" opacity="0" class="eyelid"/>
      </g>
      <!-- Eyebrows -->
      <path d="M -24 12 Q -14 9 -4 12" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 4 12 Q 14 9 24 12" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Nose -->
      <ellipse cx="0" cy="28" rx="5" ry="4" fill="#7B4A1E" opacity="0.5"/>
      <!-- Smile -->
      <path d="M -10 36 Q 0 42 10 36" stroke="#7B4A1E" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Reading glasses -->
      <ellipse cx="-14" cy="22" rx="12" ry="9" fill="none" stroke="#D4AC0D" stroke-width="1.5" opacity="0.8"/>
      <ellipse cx="14" cy="22" rx="12" ry="9" fill="none" stroke="#D4AC0D" stroke-width="1.5" opacity="0.8"/>
      <line x1="-2" y1="22" x2="2" y2="22" stroke="#D4AC0D" stroke-width="1.5"/>
      <line x1="-26" y1="22" x2="-32" y2="20" stroke="#D4AC0D" stroke-width="1.5"/>
      <line x1="26" y1="22" x2="32" y2="20" stroke="#D4AC0D" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Floating particles (dust motes in lamplight) -->
  <circle cx="300" cy="120" r="2" fill="#FFF9C4" opacity="0.6">
    <animate attributeName="cy" from="200" to="60" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="140" r="1.5" fill="#FFF9C4" opacity="0.5">
    <animate attributeName="cy" from="220" to="80" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.5" to="0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="160" r="1" fill="#FFF9C4" opacity="0.4">
    <animate attributeName="cy" from="210" to="90" dur="7s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="opacity" from="0.4" to="0" dur="7s" repeatCount="indefinite" begin="2s"/>
  </circle>
</svg>

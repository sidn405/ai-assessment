<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">
  <defs>
    <linearGradient id="labGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a3a"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
    <radialGradient id="flaskGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00cc66" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="flaskGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4488" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cc0055" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="flaskGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4488ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0044cc" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes stir {
        0%, 100% { transform: rotate(-8deg) translateX(0); }
        25% { transform: rotate(8deg) translateX(4px); }
        50% { transform: rotate(-4deg) translateX(-2px); }
        75% { transform: rotate(8deg) translateX(4px); }
      }
      @keyframes bubble-rise {
        0% { cy: 280px; opacity: 0.9; r: 4px; }
        100% { cy: 220px; opacity: 0; r: 2px; }
      }
      @keyframes color-shift-green {
        0%, 100% { stop-color: #00ff88; }
        33% { stop-color: #88ff00; }
        66% { stop-color: #00ffcc; }
      }
      @keyframes color-shift-pink {
        0%, 100% { stop-color: #ff4488; }
        33% { stop-color: #ff8800; }
        66% { stop-color: #aa00ff; }
      }
      @keyframes glow-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes smoke-rise {
        0% { transform: translateY(0) scaleX(1); opacity: 0.7; }
        100% { transform: translateY(-40px) scaleX(2); opacity: 0; }
      }
      @keyframes scientist-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      @keyframes head-tilt {
        0%, 60%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-5deg); }
        70% { transform: rotate(5deg); }
      }
      @keyframes eye-blink {
        0%, 92%, 100% { transform: scaleY(1); }
        95%, 98% { transform: scaleY(0.05); }
      }
      @keyframes flask-shake {
        0%, 80%, 100% { transform: rotate(0deg); }
        82% { transform: rotate(-5deg); }
        84% { transform: rotate(5deg); }
        86% { transform: rotate(-4deg); }
        88% { transform: rotate(4deg); }
        90% { transform: rotate(0deg); }
      }
      @keyframes sparkle {
        0%, 100% { opacity: 0; transform: scale(0); }
        50% { opacity: 1; transform: scale(1); }
      }

      .scientist-body { animation: scientist-bob 2.5s ease-in-out infinite; }
      .stir-arm { animation: stir 1.2s ease-in-out infinite; transform-origin: 230px 160px; }
      .head { animation: head-tilt 5s ease-in-out infinite; transform-origin: 180px 100px; }
      .eyes-group { animation: eye-blink 4s ease-in-out infinite; }
      .flask-main { animation: flask-shake 6s ease-in-out infinite; transform-origin: 260px 240px; }
      .smoke1 { animation: smoke-rise 3s ease-out infinite; }
      .smoke2 { animation: smoke-rise 3s ease-out infinite 1s; }
      .smoke3 { animation: smoke-rise 3s ease-out infinite 2s; }
      .glow1 { animation: glow-pulse 1.5s ease-in-out infinite; }
      .glow2 { animation: glow-pulse 1.5s ease-in-out infinite 0.5s; }
      .glow3 { animation: glow-pulse 1.5s ease-in-out infinite 1s; }
      .sparkle1 { animation: sparkle 2s ease-in-out infinite; }
      .sparkle2 { animation: sparkle 2s ease-in-out infinite 0.7s; }
      .sparkle3 { animation: sparkle 2s ease-in-out infinite 1.4s; }
    </style>
  </defs>

  <!-- Background: dark lab -->
  <rect width="400" height="320" fill="url(#labGrad)" rx="16"/>

  <!-- Lab wall tiles -->
  <g opacity="0.15" stroke="#aaa" stroke-width="0.5" fill="none">
    <line x1="0" y1="0" x2="0" y2="260"/>
    <line x1="50" y1="0" x2="50" y2="260"/>
    <line x1="100" y1="0" x2="100" y2="260"/>
    <line x1="150" y1="0" x2="150" y2="260"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="250" y1="0" x2="250" y2="260"/>
    <line x1="300" y1="0" x2="300" y2="260"/>
    <line x1="350" y1="0" x2="350" y2="260"/>
    <line x1="400" y1="0" x2="400" y2="260"/>
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
  </g>

  <!-- Background flasks on shelf -->
  <rect x="10" y="20" width="100" height="10" fill="#555" rx="2"/>
  <!-- Small bg flask 1 -->
  <path d="M 25 30 L 25 55 Q 15 65 15 75 L 45 75 Q 45 65 35 55 L 35 30 Z" fill="#00ff8844"/>
  <rect x="28" y="25" width="7" height="8" fill="#888" rx="1"/>
  <!-- Small bg flask 2 -->
  <path d="M 60 30 L 60 55 Q 50 65 50 75 L 80 75 Q 80 65 70 55 L 70 30 Z" fill="#ff448844"/>
  <rect x="63" y="25" width="7" height="8" fill="#888" rx="1"/>
  <!-- Periodic table poster -->
  <rect x="310" y="10" width="80" height="60" fill="#1a3a1a" rx="4" opacity="0.8"/>
  <text x="315" y="24" font-family="monospace" font-size="5" fill="#44ff88" opacity="0.7">H  He</text>
  <text x="315" y="32" font-family="monospace" font-size="5" fill="#44ff88" opacity="0.7">Li Be</text>
  <text x="315" y="40" font-family="monospace" font-size="5" fill="#44ff88" opacity="0.7">Na Mg</text>
  <text x="315" y="48" font-family="monospace" font-size="5" fill="#44ff88" opacity="0.7">K  Ca</text>
  <text x="315" y="56" font-family="monospace" font-size="5" fill="#44ff88" opacity="0.7">Rb Sr</text>
  <text x="315" y="64" font-family="monospace" font-size="5" fill="#44ff88" opacity="0.7">Cs Ba</text>

  <!-- Lab bench -->
  <rect x="0" y="230" width="400" height="90" fill="#444" rx="0"/>
  <rect x="0" y="228" width="400" height="14" fill="url(#tableGrad)" rx="4"/>
  <!-- Bench legs -->
  <rect x="20" y="242" width="20" height="80" fill="#333"/>
  <rect x="360" y="242" width="20" height="80" fill="#333"/>

  <!-- Flask glow effects on bench -->
  <ellipse cx="150" cy="232" rx="40" ry="10" fill="#00ff88" opacity="0.15" class="glow1" filter="url(#glow)"/>
  <ellipse cx="260" cy="232" rx="40" ry="10" fill="#ff4488" opacity="0.15" class="glow2" filter="url(#glow)"/>
  <ellipse cx="320" cy="232" rx="25" ry="8" fill="#4488ff" opacity="0.15" class="glow3" filter="url(#glow)"/>

  <!-- Flask 1 (green, being stirred into) -->
  <g transform="translate(110, 155)">
    <!-- Stand -->
    <rect x="20" y="75" width="40" height="6" fill="#888" rx="2"/>
    <rect x="35" y="81" width="10" height="15" fill="#888" rx="2"/>
    <rect x="25" y="95" width="30" height="4" fill="#888" rx="1"/>
    <!-- Flask body -->
    <path d="M 20 0 L 20 40 Q 0 60 0 80 L 80 80 Q 80 60 60 40 L 60 0 Z" fill="#1a3a2a" opacity="0.85"/>
    <!-- Liquid -->
    <path d="M 5 65 Q 0 80 0 80 L 80 80 Q 80 80 75 65 Z" fill="#00ff88" opacity="0.85" class="glow1"/>
    <!-- Bubbles -->
    <circle cx="20" cy="73" r="3" fill="#00ff88" opacity="0.7">
      <animate attributeName="cy" from="78" to="60" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="70" r="4" fill="#00ff88" opacity="0.6">
      <animate attributeName="cy" from="78" to="55" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" from="0.6" to="0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="62" cy="75" r="2" fill="#88ffaa" opacity="0.8">
      <animate attributeName="cy" from="78" to="62" dur="1.8s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="1.8s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <!-- Smoke from flask -->
    <ellipse cx="40" cy="-5" rx="8" ry="4" fill="#00ff88" opacity="0.4" class="smoke1"/>
    <ellipse cx="35" cy="-10" rx="6" ry="3" fill="#44ffaa" opacity="0.3" class="smoke2"/>
    <ellipse cx="45" cy="-15" rx="5" ry="3" fill="#00ffcc" opacity="0.2" class="smoke3"/>
    <!-- Flask neck -->
    <rect x="28" y="-15" width="24" height="18" fill="#2a4a3a" rx="4"/>
    <!-- Stopper -->
    <rect x="30" y="-20" width="20" height="8" fill="#888" rx="3"/>
    <!-- Flask shine -->
    <path d="M 12 30 Q 8 50 8 65" stroke="white" stroke-width="2" fill="none" opacity="0.2" stroke-linecap="round"/>
  </g>

  <!-- Stir rod being actively mixed -->
  <g class="stir-arm">
    <rect x="175" y="140" width="6" height="110" rx="3" fill="#c0c0c0"/>
    <rect x="173" y="240" width="10" height="4" rx="2" fill="#aaa"/>
  </g>

  <!-- SCIENTIST CHARACTER -->
  <g class="scientist-body" transform="translate(0, 0)">
    <!-- Lab coat body -->
    <rect x="140" y="150" width="90" height="90" rx="20" fill="url(#coatGrad)"/>
    <!-- Coat lapels -->
    <path d="M 170 150 L 185 180 L 200 150" fill="#e8e8e8"/>
    <!-- Coat buttons -->
    <circle cx="185" cy="190" r="3" fill="#ccc"/>
    <circle cx="185" cy="208" r="3" fill="#ccc"/>
    <!-- Name badge -->
    <rect x="200" y="168" width="25" height="18" rx="2" fill="#4488ff" opacity="0.9"/>
    <text x="202" y="178" font-family="sans-serif" font-size="5" fill="white">SCIENCE</text>
    <text x="205" y="184" font-family="sans-serif" font-size="5" fill="white">LABS</text>
    <!-- Pocket with pen -->
    <rect x="150" y="168" width="20" height="15" rx="2" fill="#d8d8d8"/>
    <rect x="157" y="163" width="3" height="10" rx="1" fill="#333"/>
    <rect x="162" y="163" width="3" height="10" rx="1" fill="#e74c3c"/>

    <!-- Neck -->
    <rect x="178" y="125" width="18" height="30" rx="8" fill="#8D5524"/>

    <!-- Head -->
    <g class="head">
      <!-- Head base -->
      <ellipse cx="187" cy="105" rx="35" ry="38" fill="#8D5524"/>
      <!-- Hair (afro/natural hair) -->
      <ellipse cx="187" cy="74" rx="38" ry="22" fill="#1a1a1a"/>
      <ellipse cx="155" cy="90" rx="12" ry="18" fill="#1a1a1a"/>
      <ellipse cx="219" cy="90" rx="12" ry="18" fill="#1a1a1a"/>
      <!-- Ears -->
      <ellipse cx="153" cy="108" rx="7" ry="10" fill="#8D5524"/>
      <ellipse cx="221" cy="108" rx="7" ry="10" fill="#8D5524"/>
      <!-- Eyes -->
      <g class="eyes-group">
        <!-- Safety goggles -->
        <rect x="160" y="99" width="62" height="20" rx="10" fill="#4488ff" opacity="0.3"/>
        <rect x="162" y="100" width="22" height="18" rx="8" fill="#2255cc" opacity="0.25"/>
        <rect x="189" y="100" width="22" height="18" rx="8" fill="#2255cc" opacity="0.25"/>
        <path d="M 184 109 L 189 109" stroke="#4488ff" stroke-width="2" opacity="0.6"/>
        <rect x="155" y="104" width="7" height="10" rx="3" fill="#4488ff" opacity="0.5"/>
        <rect x="212" y="104" width="7" height="10" rx="3" fill="#4488ff" opacity="0.5"/>
        <!-- Actual eyes -->
        <ellipse cx="173" cy="109" rx="9" ry="7" fill="white"/>
        <ellipse cx="201" cy="109" rx="9" ry="7" fill="white"/>
        <ellipse cx="173" cy="110" rx="4.5" ry="4.5" fill="#1a1a1a"/>
        <ellipse cx="201" cy="110" rx="4.5" ry="4.5" fill="#1a1a1a"/>
        <ellipse cx="174.5" cy="108.5" rx="1.5" ry="1.5" fill="white"/>
        <ellipse cx="202.5" cy="108.5" rx="1.5" ry="1.5" fill="white"/>
      </g>
      <!-- Eyebrows raised in interest -->
      <path d="M 163 97 Q 173 93 183 97" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
      <path d="M 191 97 Q 201 93 211 97" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
      <!-- Nose -->
      <ellipse cx="187" cy="118" rx="5" ry="4" fill="#7B4A1E" opacity="0.5"/>
      <!-- Excited smile -->
      <path d="M 173 127 Q 187 136 201 127" stroke="#7B4A1E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Teeth -->
      <path d="M 176 129 Q 187 138 198 129" fill="white" opacity="0.8"/>
    </g>

    <!-- Right arm (holding flask) -->
    <rect x="230" y="155" width="40" height="22" rx="10" fill="url(#coatGrad)" transform="rotate(25, 250, 166)"/>
    <!-- Right hand -->
    <ellipse cx="258" cy="195" rx="13" ry="10" fill="#8D5524"/>

    <!-- Left arm extended on table -->
    <rect x="100" y="165" width="50" height="22" rx="10" fill="url(#coatGrad)" transform="rotate(-10, 125, 176)"/>
    <!-- Left hand -->
    <ellipse cx="108" cy="185" rx="13" ry="10" fill="#8D5524"/>
  </g>

  <!-- Flask 2 (pink, being held) -->
  <g transform="translate(230, 160)" class="flask-main">
    <path d="M 15 0 L 15 30 Q 0 48 0 65 L 60 65 Q 60 48 45 30 L 45 0 Z" fill="#2a0a1a" opacity="0.9"/>
    <!-- Liquid -->
    <path d="M 5 52 Q 0 65 0 65 L 60 65 Q 60 65 55 52 Z" fill="#ff4488" opacity="0.9" class="glow2"/>
    <!-- Bubbles -->
    <circle cx="15" cy="60" r="2.5" fill="#ff88bb" opacity="0.8">
      <animate attributeName="cy" from="64" to="50" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="58" r="3" fill="#ff4488" opacity="0.7">
      <animate attributeName="cy" from="64" to="48" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <!-- Smoke -->
    <ellipse cx="30" cy="-5" rx="6" ry="3" fill="#ff4488" opacity="0.4" class="smoke2"/>
    <ellipse cx="28" cy="-12" rx="5" ry="2" fill="#ff88cc" opacity="0.3" class="smoke3"/>
    <!-- Neck -->
    <rect x="20" y="-12" width="20" height="14" fill="#1a0a12" rx="3"/>
    <!-- Shine -->
    <path d="M 8 25 Q 5 40 5 55" stroke="white" stroke-width="1.5" fill="none" opacity="0.2" stroke-linecap="round"/>
  </g>

  <!-- Flask 3 (blue, small, on right) -->
  <g transform="translate(315, 185)">
    <path d="M 10 0 L 10 22 Q 0 32 0 45 L 45 45 Q 45 32 35 22 L 35 0 Z" fill="#0a0a2a" opacity="0.9"/>
    <path d="M 4 36 Q 0 45 0 45 L 45 45 Q 45 45 41 36 Z" fill="#4488ff" opacity="0.9" class="glow3"/>
    <circle cx="15" cy="41" r="2" fill="#88aaff" opacity="0.8">
      <animate attributeName="cy" from="44" to="34" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="28" cy="40" r="2.5" fill="#4488ff" opacity="0.6">
      <animate attributeName="cy" from="44" to="32" dur="1.6s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" from="0.6" to="0" dur="1.6s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <rect x="15" y="-8" width="15" height="10" fill="#080820" rx="3"/>
    <ellipse cx="16" cy="-4" rx="5" ry="3" fill="#4488ff" opacity="0.5" class="smoke1"/>
  </g>

  <!-- Floating chemical formula text -->
  <text x="30" y="210" font-family="monospace" font-size="11" fill="#00ff88" opacity="0.5" class="sparkle1">H₂O</text>
  <text x="340" y="120" font-family="monospace" font-size="11" fill="#ff4488" opacity="0.5" class="sparkle2">O₂</text>
  <text x="60" y="140" font-family="monospace" font-size="10" fill="#4488ff" opacity="0.4" class="sparkle3">NaCl</text>

  <!-- Sparkle stars near the reaction -->
  <g class="sparkle1">
    <path d="M 200 170 L 202 164 L 204 170 L 210 172 L 204 174 L 202 180 L 200 174 L 194 172 Z" fill="#ffdd00" opacity="0.8"/>
  </g>
  <g class="sparkle2">
    <path d="M 235 150 L 237 146 L 239 150 L 243 152 L 239 154 L 237 158 L 235 154 L 231 152 Z" fill="#ff8800" opacity="0.7"/>
  </g>
  <g class="sparkle3">
    <path d="M 170 165 L 172 161 L 174 165 L 178 167 L 174 169 L 172 173 L 170 169 L 166 167 Z" fill="#44ffff" opacity="0.6"/>
  </g>
</svg>

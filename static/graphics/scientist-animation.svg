<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;" role="img">
<title>Hispanic scientist behind lab bench</title>
<style>
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,97%{transform:scaleY(0.05)}}
@keyframes glow-g{0%,100%{opacity:0.7}50%{opacity:1}}
@keyframes glow-p{0%,100%{opacity:0.7}50%{opacity:1}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
@keyframes smoke{0%{transform:translateY(0) scale(1);opacity:0.6}100%{transform:translateY(-28px) scale(2);opacity:0}}
@keyframes stir{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.bob{animation:bob 2.8s ease-in-out infinite}
.blink{animation:blink 4.5s ease-in-out infinite;transform-origin:center}
.gg{animation:glow-g 1.6s ease-in-out infinite}
.gp{animation:glow-p 1.6s ease-in-out infinite 0.8s}
.sp1{animation:sparkle 2s ease-in-out infinite}
.sp2{animation:sparkle 2s ease-in-out infinite 0.7s}
.sm1{animation:smoke 2.5s ease-out infinite}
.sm2{animation:smoke 2.5s ease-out infinite 1s}
.stir{animation:stir 1.1s ease-in-out infinite;transform-origin:210px 190px}
</style>

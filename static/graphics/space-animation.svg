<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;"><title>Female Black astronaut floating in space</title><style>@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}@keyframes twinkle{0%,100%{opacity:1}50%{opacity:0.2}}@keyframes glow{0%,100%{opacity:0.6}50%{opacity:1}}@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}.astronaut{animation:float 4s ease-in-out infinite;transform-origin:200px 160px}.twinkle1{animation:twinkle 2s ease-in-out infinite}.twinkle2{animation:twinkle 3s ease-in-out infinite 0.5s}.twinkle3{animation:twinkle 2.5s ease-in-out infinite 1s}.twinkle4{animation:twinkle 1.8s ease-in-out infinite 0.3s}.nebula{animation:glow 3s ease-in-out infinite}.satellite{animation:drift 5s ease-in-out infinite}</style><rect width="400" height="320" fill="#030818"/><ellipse cx="320" cy="80" rx="80" ry="50" fill="#2a0a4a" opacity="0.6" class="nebula"/><ellipse cx="300" cy="100" rx="60" ry="35" fill="#4a0a6a" opacity="0.4" class="nebula"/><ellipse cx="60" cy="260" rx="70" ry="40" fill="#0a2a5a" opacity="0.5"/><circle cx="30" cy="20" r="1.5" fill="white" class="twinkle1"/><circle cx="80" cy="45" r="1" fill="white" class="twinkle2"/><circle cx="140" cy="15" r="2" fill="white" class="twinkle3"/><circle cx="200" cy="35" r="1" fill="white" class="twinkle4"/><circle cx="260" cy="10" r="1.5" fill="white" class="twinkle2"/><circle cx="350" cy="30" r="1" fill="white" class="twinkle1"/><circle cx="380" cy="70" r="2" fill="white" class="twinkle3"/><circle cx="20" cy="100" r="1" fill="white" class="twinkle4"/><circle cx="370" cy="150" r="1.5" fill="#aaf" class="twinkle2"/><circle cx="50" cy="180" r="1" fill="white" class="twinkle1"/><circle cx="390" cy="200" r="1" fill="white" class="twinkle3"/><circle cx="15" cy="250" r="1.5" fill="#faf" class="twinkle4"/><circle cx="110" cy="290" r="1" fill="white" class="twinkle2"/><circle cx="330" c